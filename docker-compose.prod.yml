# Production Docker Compose for Eatier/Itiyum Backend
# Run on server with: docker-compose -f docker-compose.prod.yml up -d
# All resources are prefixed with 'itiyum_' for isolation

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: itiyum-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:-itiyum}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itiyum_secure_password}
      POSTGRES_DB: ${DB_NAME:-itiyum}
    volumes:
      - itiyum_postgres_data:/var/lib/postgresql/data
    ports:
      - "5466:5432"  # Host port 5466 - unique for itiyum
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itiyum -d itiyum"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - itiyum_network

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: itiyum-backend-prod
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-itiyum}
      DB_PASSWORD: ${DB_PASSWORD:-itiyum_secure_password}
      DB_NAME: ${DB_NAME:-itiyum}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://itiyum.aidocumines.com}
      # Google OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Email (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # OpenAI (for chatbot and AI features)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Paystack (payments)
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
    ports:
      - "3002:3001"  # Host port 3002 - unique for itiyum
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - itiyum_uploads:/app/uploads
    restart: unless-stopped
    networks:
      - itiyum_network

volumes:
  itiyum_postgres_data:
    name: itiyum_postgres_data
  itiyum_uploads:
    name: itiyum_uploads

networks:
  itiyum_network:
    name: itiyum_network
    driver: bridge

