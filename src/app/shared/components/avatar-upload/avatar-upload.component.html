<div class="modal-overlay" (click)="close()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Upload Avatar</h2>
      <button type="button" class="close-btn" (click)="close()" aria-label="Close">×</button>
    </div>

    <div class="modal-body">
      <!-- Preview -->
      @if (previewUrl()) {
        <div class="preview-container">
          <img [src]="previewUrl()" alt="Avatar preview" class="avatar-preview" />
        </div>
      } @else {
        <div class="preview-container placeholder">
          <div class="placeholder-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
          <p>No image selected</p>
        </div>
      }

      <!-- File Input (hidden) -->
      <input 
        type="file" 
        id="avatarFileInput" 
        accept="image/*" 
        (change)="onFileSelected($event)"
        style="display: none;">

      <!-- Error Message -->
      @if (error()) {
        <div class="error-message">
          {{ error() }}
        </div>
      }

      <!-- Action Buttons -->
      <div class="actions">
        <button 
          type="button" 
          class="btn btn-select" 
          (click)="triggerFileInput()"
          [disabled]="uploading()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> Select Photo
        </button>

        @if (selectedFile()) {
          <button 
            type="button" 
            class="btn btn-upload" 
            (click)="uploadAvatar()"
            [disabled]="uploading()">
            @if (uploading()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Uploading...
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><polyline points="20 6 9 17 4 12"/></svg> Upload
            }
          </button>
        }

        <button 
          type="button" 
          class="btn btn-remove" 
          (click)="removeAvatar()"
          [disabled]="uploading()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Remove Avatar
        </button>
      </div>

      <!-- Info -->
      <div class="info">
        <p>• Maximum file size: 5MB</p>
        <p>• Accepted formats: JPG, PNG, GIF, WebP</p>
        <p>• Image will be resized to 200x200px</p>
      </div>
    </div>
  </div>
</div>
