@if (ad(); as currentAd; ) {
  @if (visible() && !dismissed()) {
    <div class="floating-ad" [class]="position" (click)="onAdClick(currentAd)">
      <button type="button" class="dismiss-btn" (click)="dismiss(); $event.stopPropagation()" aria-label="Dismiss ad">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="floating-ad-inner">
        @if (currentAd.image_url) {
          <div class="ad-thumb">
            <img [src]="currentAd.image_url" [alt]="currentAd.title">
          </div>
        }
        <div class="ad-content">
          <span class="ad-label">Sponsored</span>
          <h4 class="ad-title">{{ currentAd.title }}</h4>
          <p class="ad-desc">{{ currentAd.description }}</p>
          <button class="ad-cta">
            {{ currentAd.cta_text }}
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none">
              <path d="M6 12L10 8L6 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  }
}
