<div class="sidebar-ads">
  @for (ad of ads(); track ad.id) {
    <div class="sidebar-ad-card" (click)="onAdClick(ad)">
      <span class="ad-label">Sponsored</span>
      
      @if (ad.image_url) {
        <div class="ad-image-container">
          <img [src]="ad.image_url" [alt]="ad.title" class="ad-image">
        </div>
      }

      <div class="ad-content">
        @if (ad.business_name) {
          <p class="ad-business">{{ ad.business_name }}</p>
        }
        <h4 class="ad-title">{{ ad.title }}</h4>
        <p class="ad-description">{{ ad.description }}</p>
        
        <button class="ad-cta">
          {{ ad.cta_text }}
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M5 11L9 7L5 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  }
</div>
