<!-- Stacked Sidebar Ads -->
<div class="sidebar-ads-stack">
  @for (ad of ads(); track ad.id) {
    <div class="sidebar-ad-card" (click)="onAdClick(ad)">
      <span class="ad-label">💎 Ad</span>

      @if (ad.image_url) {
        <div class="ad-image-wrapper">
          <img [src]="ad.image_url" [alt]="ad.title" class="ad-image">
          <div class="ad-overlay"></div>
        </div>
      } @else {
        <div class="ad-image-wrapper gradient-bg">
          <div class="ad-overlay"></div>
        </div>
      }

      <div class="ad-content">
        @if (ad.business_name) {
          <p class="ad-business">{{ ad.business_name }}</p>
        }
        <h4 class="ad-title">{{ ad.title }}</h4>
        <p class="ad-description">{{ ad.description }}</p>

        <button class="ad-cta" (click)="onAdClick(ad); $event.stopPropagation()">
          {{ ad.cta_text }}
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" class="cta-icon">
            <path d="M5 11L9 7L5 3" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  }
</div>
