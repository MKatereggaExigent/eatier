<div class="business-dashboard-wrapper">
  <!-- Mobile Header -->
  <header class="mobile-header">
    <button type="button" class="menu-toggle" (click)="toggleSidebar()" aria-label="Toggle menu">
      <span class="hamburger" [class.open]="isSidebarOpen()">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
    <h2 class="mobile-title">Business Dashboard</h2>
    <div class="mobile-user-avatar">
      {{ getUserInitials() }}
    </div>
  </header>

  <!-- Overlay for mobile -->
  @if (isSidebarOpen()) {
    <div class="nav-overlay" (click)="closeSidebar()"></div>
  }

  <app-sidebar></app-sidebar>

  <main class="dashboard">
    <h1><span class="itiyum-brand">Itiyum</span> for Business</h1>
    <router-outlet></router-outlet>
  </main>
</div>
