# =============================================================================
# ITIYUM PLATFORM - AZURE DOCKER COMPOSE
# =============================================================================
# Use this for local testing of production Docker images
# NOT for actual Azure deployment (use App Service containers)
# =============================================================================

version: "3.8"

services:
  # PostgreSQL Database (for local testing)
  postgres:
    image: postgres:14-alpine
    container_name: itiyum-postgres-azure
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-itiyum_platform}
      POSTGRES_USER: ${DB_USER:-itiyum_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itiyum_secure_password_2024}
    ports:
      - "5466:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itiyum_user} -d ${DB_NAME:-itiyum_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itiyum-network

  # Backend API (Production image)
  backend:
    build:
      context: ../..
      dockerfile: azure/docker/Dockerfile.backend.prod
    container_name: itiyum-backend-azure
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-itiyum_platform}
      DB_USER: ${DB_USER:-itiyum_user}
      DB_PASSWORD: ${DB_PASSWORD:-itiyum_secure_password_2024}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - itiyum-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Production image with nginx)
  frontend:
    build:
      context: ../..
      dockerfile: azure/docker/Dockerfile.frontend.prod
      args:
        ENVIRONMENT: production
    container_name: itiyum-frontend-azure
    restart: unless-stopped
    environment:
      API_URL: http://backend:3001
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - itiyum-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  itiyum-network:
    driver: bridge

